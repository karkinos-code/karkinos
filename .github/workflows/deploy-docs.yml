name: Deploy MkDocs documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-docs.yml'
      - 'docs/**'
      - 'properdocs.yml'
  pull_request:
    paths:
      - '.github/workflows/deploy-docs.yml'
      - 'docs/**'
      - 'properdocs.yml'
  workflow_dispatch:      # Adds a "Run workflow" button for manual runs

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
 
permissions:
  contents: write         # Job pushes to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'docs/requirements.txt'

      - name: Install ProperDocs and theme
        run: pip install -r docs/requirements.txt

      - name: Check that the docs build
        run: properdocs build --strict

      - name: Configure Git identity and credentials
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        run: properdocs gh-deploy --force
