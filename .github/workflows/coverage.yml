name: Coverage

# When a push to main is attempted, or any type of PR is performed, this CI
# file should run.
on:
  push:
    branches: [main]
  pull_request:

# Specifies the environment variables for cargo to use.
# For example, always turn cargo text colors on and change warnings to errors.
env:
  CARGO_TERM_COLOR: always

# Start of jobs to run
jobs:

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov -all-features --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
