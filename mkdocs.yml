# Start off documentation

site_name: Karkinos
site_url: https://karkinos-code.github.io/karkinos/
repo_url: https://github.com/karkinos-code/karkinos

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  #- Code Reference: reference/

theme:
  name: simplex
  locale: en
  include_sidebar: true
  color_mode: auto
  user_color_mode_toggle: true
  nav_style: primary
  highlightjs: true
  hljs_languages:
    - rust
    - toml

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdogstrings:
      handlers:
          python:
              paths: [src]        # Same folder as in the script

