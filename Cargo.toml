[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.85" 
license       = "MIT"
authors       = ["Yasmina Elmore", "Leah Hartman", "Zahraa Noureddine", "Janice Zou"] 
repository    = "https://github.com/karkinos-code/karkinos"
homepage      = "https://github.com/karkinos-code"
documentation = "https://karkinos-code.github.io/karkinos/"
readme        = "README.md"

[workspace.dependencies]
# Internal crates
karkinos             = { path = "crates/karkinos",             version = "0.1.0" }
karkinos-core        = { path = "crates/karkinos-core",        version = "0.1.0" }
karkinos-medium      = { path = "crates/karkinos-medium",      version = "0.1.0" }
karkinos-beam        = { path = "crates/karkinos-beam",        version = "0.1.0" }
karkinos-integrators = { path = "crates/karkinos-integrators", version = "0.1.0" }
karkinos-optics      = { path = "crates/karkinos-optics",      version = "0.1.0" }
karkinos-radiation   = { path = "crates/karkinos-radiation",   version = "0.1.0" }
karkinos-io          = { path = "crates/karkinos-io",          version = "0.1.0" }
karkinos-sim         = { path = "crates/karkinos-sim",         version = "0.1.0" }

# External crates
rayon = "1"
toml  = "0.9"
serde = { version = "1.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code  = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic               = { level = "warn", priority = -1 }
many_single_char_names = "allow"
similar_names          = "allow"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.profiling]
inherits = "release"
debug    = "line-tables-only"
strip    = false

[profile.dev.package."*"]
opt-level = 2
